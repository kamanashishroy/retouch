<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <radialGradient id="g1" cx="0.15" cy="0.1" r="0.7"><stop offset="0" stop-color="#9a5ca3" stop-opacity=".95"/><stop offset="1" stop-color="#9a5ca3" stop-opacity="0"/></radialGradient>
    <radialGradient id="g2" cx="0.92" cy="0.18" r="0.6"><stop offset="0" stop-color="#f4c05f" stop-opacity=".8"/><stop offset="1" stop-color="#f4c05f" stop-opacity="0"/></radialGradient>
    <radialGradient id="g3" cx="0.6" cy="1.05" r="0.6"><stop offset="0" stop-color="#d9b3e2" stop-opacity=".55"/><stop offset="1" stop-color="#d9b3e2" stop-opacity="0"/></radialGradient>
    <linearGradient id="pen" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffd98a"/><stop offset="1" stop-color="#f4c05f"/></linearGradient>
    <clipPath id="tile"><rect x="10" y="10" width="108" height="108" rx="26"/></clipPath>
  </defs>
  <!-- tile: the site's dark glass with its three glows -->
  <rect x="10" y="10" width="108" height="108" rx="26" fill="#0b0b0d"/>
  <g clip-path="url(#tile)">
    <rect x="10" y="10" width="108" height="108" fill="url(#g1)"/>
    <rect x="10" y="10" width="108" height="108" fill="url(#g2)"/>
    <rect x="10" y="10" width="108" height="108" fill="url(#g3)"/>
  </g>
  <rect x="10.75" y="10.75" width="106.5" height="106.5" rx="25.5" fill="none" stroke="rgba(255,255,255,.22)" stroke-width="1.5"/>
  <!-- three lines of text; the middle one is the change, marked in yellow like a saved edit -->
  <rect x="32" y="40" width="64" height="9" rx="4.5" fill="#fff" opacity=".96"/>
  <rect x="32" y="62" width="26" height="9" rx="4.5" fill="#fff" opacity=".96"/>
  <rect x="62" y="62" width="18" height="9" rx="4.5" fill="#f4c05f"/>
  <rect x="32" y="84" width="30" height="9" rx="4.5" fill="#fff" opacity=".7"/>
  <!-- pencil resting on the change -->
  <g transform="translate(103 48) rotate(45)">
    <rect x="-7" y="-2" width="14" height="42" rx="3.5" fill="url(#pen)"/>
    <rect x="-7" y="-2" width="14" height="8" rx="3.5" fill="#d9b3e2"/>
    <path d="M-7 40 L0 54 L7 40 Z" fill="#f0d3b5"/>
    <path d="M-2.4 49.2 L0 54 L2.4 49.2 Z" fill="#0b0b0d"/>
  </g>
</svg>
