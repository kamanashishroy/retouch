<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 50" width="200" height="50">
  <defs>
    <linearGradient id="wrong-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8a3ab9"/>
      <stop offset="100%" stop-color="#fbad50"/>
    </linearGradient>
  </defs>
  <!-- 2015-era gradient square with rounded corners -->
  <rect x="5" y="5" width="40" height="40" rx="10" fill="url(#wrong-grad)"/>
  <!-- Generic white pencil glyph -->
  <g transform="translate(15, 14) rotate(45 10 10)">
    <rect x="8" y="0" width="6" height="16" rx="1" fill="#ffffff"/>
    <polygon points="8,17 11,22 14,17" fill="#ffffff"/>
  </g>
  <!-- Dated rounded geometric wordmark with wide tracking -->
  <text x="56" y="32" font-family="'Arial Rounded MT Bold', 'Comfortaa', -apple-system, sans-serif" font-weight="600" font-size="22" letter-spacing="2.5" fill="#7a4b91">ReTouch</text>
</svg>
